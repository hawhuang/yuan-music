<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>照片管理 - 缘音乐</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #e8eaf6 0%, #fce4ec 50%, #f3e5f5 100%);
            font-family: 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            color: #5d4037;
        }
        .bubble {
            position: fixed; border-radius: 50%; z-index: 0; pointer-events: none; opacity: 0.25;
            animation: bubbleFloat ease-in-out infinite;
        }
        .bubble.b1 { width: 130px; height: 130px; background: #f8bbd0; top: -30px; right: -30px; animation-duration: 8s; }
        .bubble.b2 { width: 90px; height: 90px; background: #c8e6c9; bottom: 10%; left: -20px; animation-duration: 10s; animation-delay: 2s; }
        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.03); }
        }

        .navbar-cute {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(15px);
            border-bottom: 2px solid #f8bbd0;
            box-shadow: 0 2px 12px rgba(233, 150, 180, 0.15);
        }
        .navbar-cute .navbar-brand {
            color: #e91e63 !important;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }
        .btn-nav {
            border: 2px solid #f06292 !important;
            color: #e91e63 !important;
            border-radius: 20px !important;
            font-size: 0.85rem;
            padding: 4px 16px !important;
            transition: all 0.3s;
            font-weight: 500;
            background: transparent;
        }
        .btn-nav:hover {
            background: #fce4ec !important;
            box-shadow: 0 2px 10px rgba(240, 98, 146, 0.2);
            color: #c2185b !important;
        }

        .container { position: relative; z-index: 1; }

        .user-photo-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(248, 187, 208, 0.4);
            border-radius: 20px;
            margin-bottom: 15px;
            padding: 18px 20px;
            transition: all 0.3s;
            box-shadow: 0 3px 12px rgba(233, 150, 180, 0.1);
        }
        .user-photo-card:hover {
            border-color: #f8bbd0;
            box-shadow: 0 6px 20px rgba(233, 150, 180, 0.18);
        }
        .user-photo-card h5 {
            color: #5d4037;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .user-photo-card h5 small {
            color: #a1887f;
            font-weight: 400;
        }

        .photo-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .photo-item {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #f8bbd0;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-item .del-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ef5350;
            border: none;
            color: #fff;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 2px 6px rgba(239, 83, 80, 0.3);
        }
        .photo-item:hover .del-btn { opacity: 1; }

        .add-photo-btn {
            width: 90px;
            height: 90px;
            border-radius: 14px;
            border: 2px dashed #e1bee7;
            background: rgba(243, 229, 245, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #ce93d8;
            font-size: 1.5rem;
        }
        .add-photo-btn:hover {
            border-color: #f06292;
            background: rgba(252, 228, 236, 0.4);
            color: #f06292;
        }
        .add-photo-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .photo-count {
            display: inline-block;
            background: linear-gradient(135deg, #fce4ec, #f3e5f5);
            border: 1px solid #f8bbd0;
            color: #e91e63;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 8px;
            font-weight: 600;
        }

        .uploading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid #e1bee7;
            border-top-color: #ab47bc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .desc-text {
            color: #a1887f;
            font-size: 0.88rem;
            margin-bottom: 15px;
        }

        .heart {
            position: fixed; z-index: 0; pointer-events: none;
            opacity: 0;
            animation: heartFloat linear infinite;
        }
        @keyframes heartFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>

    <nav class="navbar navbar-cute sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand">📷 照片管理</span>
            <a href="/admin_import" class="btn btn-nav">🔙 返回导入</a>
        </div>
    </nav>

    <div class="container mt-3 pb-4">
        <p class="desc-text">
            🌟 为每位用户上传照片（每人最多3张），支持 jpg/png/gif/webp 格式
        </p>

        {% for user in users %}
        <div class="user-photo-card" id="user-{{ user.id }}">
            <h5>
                {{ user.nickname }}
                <small>{{ user.phone }} · {{ user.gender }} · {{ user.age or '?' }}岁</small>
                <span class="photo-count" id="count-{{ user.id }}">{{ user.photos|length }}/3</span>
            </h5>
            <div class="photo-grid" id="grid-{{ user.id }}">
                {% for photo in user.photos %}
                <div class="photo-item" id="photo-{{ photo.id }}">
<img src="/photo/{{ photo.id }}" alt="照片">
                    <button class="del-btn" onclick="adminDeletePhoto({{ photo.id }}, {{ user.id }})" title="删除">✕</button>
                </div>
                {% endfor %}
                {% if user.photos|length < 3 %}
                <div class="add-photo-btn" id="addBtn-{{ user.id }}" onclick="adminUpload({{ user.id }})">+</div>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/jpeg,image/png,image/gif,image/webp';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);

        let currentUserId = null;

        function adminUpload(uid) {
            currentUserId = uid;
            fileInput.click();
        }

        fileInput.addEventListener('change', function() {
            if (!this.files[0] || !currentUserId) return;
            const file = this.files[0];
            const uid = currentUserId;

            if (file.size > 5 * 1024 * 1024) {
                alert('照片大小不能超过 5MB');
                this.value = '';
                return;
            }

            const addBtn = document.getElementById('addBtn-' + uid);
            if (addBtn) {
                addBtn.innerHTML = '<div class="spinner"></div>';
                addBtn.classList.add('disabled');
                addBtn.onclick = null;
            }

            const formData = new FormData();
            formData.append('photo', file);

            fetch(`/admin_upload_photo/${uid}`, { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        const grid = document.getElementById('grid-' + uid);
                        if (addBtn) addBtn.remove();

                        const photoDiv = document.createElement('div');
                        photoDiv.className = 'photo-item';
                        photoDiv.id = 'photo-' + data.photo_id;
                        photoDiv.innerHTML = `
                            <img src="${data.url}" alt="照片">
                            <button class="del-btn" onclick="adminDeletePhoto(${data.photo_id}, ${uid})" title="删除">✕</button>
                        `;
                        grid.appendChild(photoDiv);

                        updateCount(uid, 1);

                        const count = grid.querySelectorAll('.photo-item').length;
                        if (count < 3) {
                            const newBtn = document.createElement('div');
                            newBtn.className = 'add-photo-btn';
                            newBtn.id = 'addBtn-' + uid;
                            newBtn.innerHTML = '+';
                            newBtn.onclick = function() { adminUpload(uid); };
                            grid.appendChild(newBtn);
                        }
                    } else {
                        alert(data.error || '上传失败');
                        if (addBtn) {
                            addBtn.innerHTML = '+';
                            addBtn.classList.remove('disabled');
                            addBtn.onclick = function() { adminUpload(uid); };
                        }
                    }
                })
                .catch(() => {
                    alert('上传失败，请重试');
                    if (addBtn) {
                        addBtn.innerHTML = '+';
                        addBtn.classList.remove('disabled');
                        addBtn.onclick = function() { adminUpload(uid); };
                    }
                });
            this.value = '';
        });

        function adminDeletePhoto(photoId, uid) {
            if (!confirm('确定删除这张照片吗？')) return;
            fetch(`/admin_delete_photo/${photoId}`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        const photoEl = document.getElementById('photo-' + photoId);
                        if (photoEl) photoEl.remove();

                        updateCount(uid, -1);

                        const grid = document.getElementById('grid-' + uid);
                        if (!document.getElementById('addBtn-' + uid)) {
                            const newBtn = document.createElement('div');
                            newBtn.className = 'add-photo-btn';
                            newBtn.id = 'addBtn-' + uid;
                            newBtn.innerHTML = '+';
                            newBtn.onclick = function() { adminUpload(uid); };
                            grid.appendChild(newBtn);
                        }
                    } else {
                        alert(data.error || '删除失败');
                    }
                })
                .catch(() => alert('删除失败，请重试'));
        }

        function updateCount(uid, delta) {
            const countEl = document.getElementById('count-' + uid);
            if (countEl) {
                const parts = countEl.textContent.split('/');
                const newCount = parseInt(parts[0]) + delta;
                countEl.textContent = newCount + '/3';
            }
        }

        const hearts = ['🌸', '📷', '✨', '💕', '🌷'];
        for (let i = 0; i < 8; i++) {
            const h = document.createElement('div');
            h.className = 'heart';
            h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 0.6 + 0.8) + 'rem';
            h.style.animationDuration = (Math.random() * 12 + 12) + 's';
            h.style.animationDelay = (Math.random() * 15) + 's';
            document.body.appendChild(h);
        }
    </script>
</body>
</html>
