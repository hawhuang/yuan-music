<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>缘音乐 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 30%, #e8eaf6 60%, #e0f7fa 100%);
            display: flex; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }
        /* 浮动装饰气泡 */
        .bubble {
            position: fixed; border-radius: 50%; z-index: 0; pointer-events: none;
            opacity: 0.4;
            animation: bubbleFloat ease-in-out infinite;
        }
        .bubble.b1 { width: 120px; height: 120px; background: #f8bbd0; top: 10%; left: 5%; animation-duration: 6s; }
        .bubble.b2 { width: 80px; height: 80px; background: #b3e5fc; top: 60%; right: 8%; animation-duration: 8s; animation-delay: 1s; }
        .bubble.b3 { width: 60px; height: 60px; background: #c8e6c9; bottom: 15%; left: 15%; animation-duration: 7s; animation-delay: 2s; }
        .bubble.b4 { width: 100px; height: 100px; background: #ffe0b2; top: 20%; right: 15%; animation-duration: 9s; animation-delay: 0.5s; }
        .bubble.b5 { width: 50px; height: 50px; background: #d1c4e9; bottom: 30%; right: 25%; animation-duration: 5s; animation-delay: 3s; }
        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .login-card {
            position: relative; z-index: 1;
            width: 90%; max-width: 400px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            border: 2px solid rgba(255, 182, 193, 0.3);
            box-shadow: 0 8px 32px rgba(233, 150, 180, 0.2), 0 2px 8px rgba(0,0,0,0.05);
        }
        .login-card h3 {
            color: #e91e63;
            font-weight: 700;
            font-size: 1.8rem;
        }
        .login-card .subtitle {
            color: #ab47bc;
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .form-control {
            background: rgba(255,255,255,0.9);
            border: 2px solid #f8bbd0;
            border-radius: 16px;
            color: #5d4037;
            padding: 14px 18px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-control::placeholder { color: #ce93d8; }
        .form-control:focus {
            background: #fff;
            border-color: #f06292;
            box-shadow: 0 0 0 3px rgba(240, 98, 146, 0.15);
            color: #4a148c;
        }
        .btn-cute {
            background: linear-gradient(135deg, #f06292, #ab47bc);
            border: none; border-radius: 16px;
            color: #fff; font-weight: 700;
            padding: 14px; font-size: 1.05rem;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(240, 98, 146, 0.3);
        }
        .btn-cute:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(240, 98, 146, 0.4);
            color: #fff;
        }
        .btn-cute:active { transform: translateY(0); }
        /* flash 消息 */
        .alert-cute {
            background: #fff3e0;
            border: 2px solid #ffcc80;
            color: #e65100;
            border-radius: 14px;
            font-size: 0.9rem;
        }
        /* 浮动爱心 */
        .heart {
            position: fixed; z-index: 0; pointer-events: none;
            font-size: 1.2rem;
            animation: heartFloat linear infinite;
            opacity: 0;
        }
        @keyframes heartFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>

    <div class="login-card text-center">
        <h3>🎵 缘音乐</h3>
        <p class="subtitle">♪ YUAN MUSIC ♪</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-cute mb-3">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/login" method="post">
            <div class="mb-4">
                <input type="text" name="phone" class="form-control" placeholder="📱 输入手机号登录" required>
            </div>
            <button type="submit" class="btn btn-cute w-100">🌸 进入广场</button>
        </form>
    </div>

    <script>
        // 生成浮动爱心
        const hearts = ['💕', '🌸', '✨', '💗', '🎵', '🌷', '💜', '🎶'];
        for (let i = 0; i < 15; i++) {
            const h = document.createElement('div');
            h.className = 'heart';
            h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 1 + 0.8) + 'rem';
            h.style.animationDuration = (Math.random() * 10 + 10) + 's';
            h.style.animationDelay = (Math.random() * 12) + 's';
            document.body.appendChild(h);
        }
    </script>
</body>
</html>
